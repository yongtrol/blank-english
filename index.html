<style>

@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121722; --card: #1b2230; --ink: #e8ecf4; --muted: #9aa6bb;
  --accent: #7d9cff; --mark: #6b5a12; --good: #4cc38a; --bad: #ff7a66; --line: #2c3547; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121722; --card: #1b2230; --ink: #e8ecf4; --muted: #9aa6bb;
  --accent: #7d9cff; --mark: #6b5a12; --good: #4cc38a; --bad: #ff7a66; --line: #2c3547; color-scheme: dark }

body { background: var(--bg); color: var(--ink); font-family: var(--kr);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 32px; }
main { max-width: 640px; margin: 0 auto; display: grid; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; }
h1 { font-family: var(--display); font-size: 1.25rem; margin: 0; }
.stats { font-family: var(--display); font-variant-numeric: tabular-nums; color: var(--muted); display: flex; gap: 14px; font-size: .9rem; }
.stats b { color: var(--ink); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px 24px; display: grid; gap: 18px; }
.en { font-family: var(--display); font-size: clamp(1.25rem, 4.5vw, 1.6rem); line-height: 1.7; margin: 0; text-wrap: balance; }
.blank { display: inline-block; background: var(--mark); border-radius: 6px; padding: 0 6px; min-width: 3ch; }
.blank input { font: inherit; color: var(--ink); background: transparent; border: none; border-bottom: 2px solid var(--ink);
  outline: none; text-align: center; padding: 0; width: var(--w, 6ch); }
.blank.ok input { color: var(--good); border-color: var(--good); }
.blank.no input { color: var(--bad); border-color: var(--bad); }
.blank.shake { animation: shake .3s; }
@keyframes shake { 25% { transform: translateX(-5px) } 75% { transform: translateX(5px) } }
.ko { color: var(--muted); font-size: 1.05rem; margin: 0; line-height: 1.6; }
.ko u { color: var(--ink); text-decoration: underline 2px var(--accent); text-underline-offset: 5px; }
.hint { font-size: .9rem; color: var(--muted); min-height: 1.4em; margin: 0; }
.hint.good { color: var(--good); } .hint.bad { color: var(--bad); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
button { font: 600 .95rem var(--kr); border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--ink); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
button:focus-visible, .blank input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.keys { font-size: .8rem; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: reduce) { .blank.shake { animation: none; } }
</style>

<main>
  <header>

</main>

  ["He [drives] to work every day.", "그는 매일 [차로 출근한다]."],
  ["The [window] is broken.", "[창문이] 깨졌다."],
  ["I [fell] asleep on the sofa.", "소파에서 [잠들어] 버렸다."],
  ["She [paid] for my lunch.", "그녀가 내 점심값을 [냈다]."],
  ["We [talked] for hours on the phone.", "우리는 몇 시간 동안 [통화했다]."],
  ["The [weekend] went by so fast.", "[주말이] 너무 빨리 지나갔다."],
  ["I [brushed] my teeth and went to bed.", "이를 [닦고] 잠자리에 들었다."],
  ["He [carried] the heavy bag for me.", "그는 나 대신 무거운 가방을 [들어] 주었다."],
  ["Can you [speak] more slowly?", "좀 더 천천히 [말해] 줄래요?"],
  ["The [flowers] in the garden are blooming.", "정원의 [꽃들이] 피고 있다."],
  ["I [threw] away the old shoes.", "낡은 신발을 [버렸다]."],
  ["She is [allergic] to peanuts.", "그녀는 땅콩 [알레르기가] 있다."],
  ["He [knocked] on the door twice.", "그는 문을 두 번 [두드렸다]."],
  ["The [answer] is on the next page.", "[답은] 다음 페이지에 있다."],
  ["We [rented] a car for the trip.", "우리는 여행을 위해 차를 [빌렸다]."],
  ["I [learned] to swim when I was five.", "나는 다섯 살 때 수영을 [배웠다]."],
  ["She [cleaned] her room all morning.", "그녀는 오전 내내 방을 [청소했다]."],
  ["The store [opens] at ten.", "그 가게는 10시에 [문을 연다]."],
  ["He [kept] the secret for years.", "그는 몇 년 동안 비밀을 [지켰다]."],
  ["I'm [interested] in history.", "나는 역사에 [관심이] 있다."],
  ["The [sky] is clear today.", "오늘 [하늘이] 맑다."],
  ["She [trusted] him completely.", "그녀는 그를 완전히 [믿었다]."],
  ["Please [bring] your ID card.", "신분증을 [가져오세요]."],
  ["I [compared] the prices online.", "온라인에서 가격을 [비교했다]."],
  ["He [exercises] three times a week.", "그는 일주일에 세 번 [운동한다]."],
  ["We [decorated] the tree together.", "우리는 함께 트리를 [꾸몄다]."],
  ["The [kitchen] smells like bread.", "[부엌에서] 빵 냄새가 난다."],
  ["I [hurried] to catch the train.", "기차를 타려고 [서둘렀다]."],
  ["She [prepared] a speech for the event.", "그녀는 행사를 위해 연설을 [준비했다]."],
  ["I'm [nervous] about the interview.", "면접 때문에 [긴장돼]."],
  ["He [repaired] the broken chair.", "그는 부서진 의자를 [고쳤다]."],
  ["The [moon] is bright tonight.", "오늘 밤 [달이] 밝다."],
  ["I [wish] I could fly.", "날 수 있으면 [좋겠다]."],
  ["She [returned] the book to the library.", "그녀는 도서관에 책을 [반납했다]."],
  ["We [cheered] for our team.", "우리는 우리 팀을 [응원했다]."],
  ["Don't [touch] the paint. It's still wet.", "페인트 [만지지] 마. 아직 안 말랐어."],
  ["The [meeting] lasted two hours.", "[회의는] 두 시간 동안 이어졌다."],
  ["He [hid] the gift under the bed.", "그는 선물을 침대 밑에 [숨겼다]."],
  ["I [counted] the money twice.", "나는 돈을 두 번 [셌다]."],
  ["She is the [tallest] girl in her class.", "그녀는 반에서 키가 [가장 크다]."],
  ["Every cloud has a silver [lining].", "괴로운 일에도 [좋은 면은] 있다."]
];
console.assert(new Set(DATA.map(d => d[0])).size === DATA.length, "duplicate sentence");

function parse(s) {
  const m = s.match(/^(.*)\[(.+?)\](.*)$/);
  return { before: m[1], answer: m[2], after: m[3] };
}
console.assert(parse("a [b] c").answer === "b" && parse("a [b] c").after === " c", "parse");

const norm = s => s.trim().toLowerCase().replace(/[’]/g, "'");
const $ = id => document.getElementById(id);
const MAX_CLUES = 2; // 문장당 힌트 횟수
let order = [], idx = -1, cur, solved = false, clueLen = 0;
const score = { right: 0, skipped: 0, streak: 0 };

function shuffle() { order = DATA.map((_, i) => i).sort(() => Math.random() - .5); idx = -1; }

function next() {
  if (++idx >= order.length) shuffle(), idx = 0;
  const [en, ko] = DATA[order[idx]];
  cur = parse(en); solved = false; clueLen = 0;
  const p = $("en"); p.textContent = "";
  const span = document.createElement("span"); span.className = "blank";
  const inp = document.createElement("input");
  inp.id = "answer"; inp.autocomplete = "off"; inp.spellcheck = false; inp.setAttribute("autocapitalize", "off");
  inp.setAttribute("aria-label", "빈칸에 들어갈 단어");
  inp.style.setProperty("--w", Math.max(4, cur.answer.length + 1) + "ch");
  span.append(inp);
  p.append(cur.before, span, cur.after);
  // 한국어의 [ ] 부분 = 빈칸 단어의 뜻, 밑줄로 표시
  const k = ko.match(/^(.*)\[(.+?)\](.*)$/), ul = document.createElement("u");
  $("ko").textContent = "";
  if (k) { ul.textContent = k[2]; $("ko").append(k[1], ul, k[3]); } else $("ko").textContent = ko;
  setHint(`${cur.answer.length}글자`);
  $("check").textContent = "확인";
  $("clue").disabled = false; $("clue").textContent = `힌트 (${MAX_CLUES})`;
  inp.focus();
}

function setHint(text, cls = "") { const h = $("hint"); h.textContent = text; h.className = "hint " + cls; }
function render() { for (const k in score) $(k === "skipped" ? "skipped" : k).textContent = score[k]; }

function check() {
  if (solved) return next();
  const inp = $("answer"), span = inp.parentElement;
  if (!inp.value.trim()) return inp.focus();
  if (norm(inp.value) === norm(cur.answer)) {
    solved = true; span.className = "blank ok"; inp.readOnly = true;
    score.right++; score.streak++; render();
    setHint("정답! Enter를 누르면 다음 문장", "good");
    $("check").textContent = "다음";
    $("check").focus();
  } else {
    span.className = "blank no shake";
    setTimeout(() => span.classList.remove("shake"), 300);
    score.streak = 0; render();
    setHint("다시 해 보세요", "bad");
    inp.select();
  }
}

function skip() {
  if (solved) return next();
  const inp = $("answer");
  inp.value = cur.answer; inp.readOnly = true; inp.parentElement.className = "blank no";
  solved = true; score.skipped++; score.streak = 0; render();
  setHint(`정답은 "${cur.answer}"`, "bad");
  $("check").textContent = "다음"; $("check").focus();
}

function clue() {
  if (solved || clueLen >= MAX_CLUES) return;
  clueLen = Math.min(clueLen + 1, cur.answer.length);
  const left = MAX_CLUES - clueLen;
  $("clue").textContent = `힌트 (${left})`;
  $("clue").disabled = left === 0;
  const inp = $("answer");
  inp.value = cur.answer.slice(0, clueLen); inp.focus();
  setHint(`${cur.answer.length}글자 · "${cur.answer.slice(0, clueLen)}"로 시작`);
}

$("check").onclick = check; $("skip").onclick = skip; $("clue").onclick = clue;
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.tagName !== "BUTTON") { e.preventDefault(); check(); }
  if (e.key === "Escape") skip();
});
shuffle(); next();
</script>
